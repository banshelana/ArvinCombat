# nginx site for the ArvinCombat game server on mm3.arvinplay.com (TLS = certbot / Cloudflare in front).
# Put inside the existing "server { listen 443 ssl; server_name mm3.arvinplay.com; ... }" block,
# or use this whole file and run:  sudo certbot --nginx -d mm3.arvinplay.com

map $http_upgrade $arvin_conn { default upgrade; '' close; }

server {
    listen 80;
    server_name mm3.arvinplay.com;

    # status (no login)
    location = /status {
        proxy_pass http://127.0.0.1:5080/status;
        proxy_set_header Host $host;
    }

    # matchmaker WebSocket
    location = /match {
        proxy_pass http://127.0.0.1:5080/match;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arvin_conn;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Sec-WebSocket-Extensions "";   # no permessage-deflate
        proxy_read_timeout 900s;
    }

    # rooms: wss://mm3.arvinplay.com/room/{port}  ->  ws://127.0.0.1:{port}/room/{port}   (ports 7800-7899)
    location ~ ^/room/(78[0-9][0-9])$ {
        proxy_pass http://127.0.0.1:$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arvin_conn;
        proxy_set_header Host $host;
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_read_timeout 900s;
    }

    # never expose the rooms' internal heartbeat endpoint
    location /internal/ { return 404; }
}
