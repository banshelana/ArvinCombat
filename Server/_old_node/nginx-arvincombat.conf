# Optional: serve the game on normal port 80 / 443 (https) through nginx.
# Copy to /etc/nginx/sites-available/arvincombat, link it into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mm3.arvinplay.com      (free https certificate)
# After that players open https://mm3.arvinplay.com/  (the game uses wss:// automatically)

server {
    listen 80;
    server_name mm3.arvinplay.com;

    # online battles (WebSocket)
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # the web game itself (the Node server sends the gzip headers Unity needs)
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }
}
